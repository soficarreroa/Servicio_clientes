spring.application.name=inventario-service
server.port=${INVENTARIOS_PORT:8082}

# Importar configuracion centralizada .env si existe en raiz o subdirectorio
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# --- MySQL (db_inventarios) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_inventarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Carga de productos de ejemplo (data.sql) después de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# RNF-05: no exponer detalles internos en los errores
server.error.include-message=never
server.error.include-stacktrace=never
spring.sql.init.encoding=UTF-8
