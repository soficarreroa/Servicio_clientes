spring.application.name=inventario-service
server.port=8082

# --- MySQL (cambia usuario/clave por los de tu equipo o usa variables de entorno) ---
spring.datasource.url=jdbc:mysql://localhost:3306/db_inventarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Carga de productos de ejemplo (data.sql) después de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# RNF-05: no exponer detalles internos en los errores
server.error.include-message=never
server.error.include-stacktrace=never
spring.sql.init.encoding=UTF-8
