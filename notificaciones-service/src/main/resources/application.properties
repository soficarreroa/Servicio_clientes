spring.application.name=notificaciones-service
server.port=${NOTIFICACIONES_PORT:8085}

# Importar configuracion centralizada .env si existe en raiz o subdirectorio
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# --- Configuración de Canal de Notificaciones ---
# Por defecto simulado en consola (true para activar SMTP real)
notificaciones.smtp.habilitado=${SMTP_HABILITADO:false}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# RNF-05: no exponer detalles internos
server.error.include-message=never
server.error.include-stacktrace=never
