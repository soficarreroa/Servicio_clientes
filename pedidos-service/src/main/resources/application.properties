spring.application.name=pedidos-service
server.port=8083

# --- MySQL (usuario y clave por variables de entorno; nunca se suben a GitHub) ---
spring.datasource.url=jdbc:mysql://localhost:3306/db_pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- ESB (RF-07 / RF-P14): pedidos solo conoce la dirección del ESB ---
esb.base-url=${ESB_URL:http://localhost:8280}
# Tiempos máximos: si se superan, el pedido responde 503 y no se guarda
esb.connect-timeout=2s
esb.read-timeout=5s

# RNF-05: no exponer detalles internos en los errores
server.error.include-message=never
server.error.include-stacktrace=never
