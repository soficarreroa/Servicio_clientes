spring.application.name=pedidos-service
server.port=${PEDIDOS_PORT:8083}

# Importar configuracion centralizada .env si existe en raiz o subdirectorio
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# --- MySQL (db_pedidos) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_pedidos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- ESB (RF-07 / RF-P14): pedidos solo conoce la dirección del ESB ---
esb.base-url=${ESB_URL:http://localhost:8280}
esb.connect-timeout=2s
esb.read-timeout=5s

# RNF-05: no exponer detalles internos en los errores
server.error.include-message=never
server.error.include-stacktrace=never
