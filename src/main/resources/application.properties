# Logs cortos
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF

# Importar configuracion centralizada .env si existe en raiz o subdirectorio
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

server.port=${CLIENTES_PORT:8081}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/clientes_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
