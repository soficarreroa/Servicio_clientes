spring.application.name=facturacion-service-test
server.port=8084

# H2 en memoria para pruebas unitarias y de integracion
spring.datasource.url=jdbc:h2:mem:db_facturacion_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

