spring.application.name=facturacion-service
server.port=${FACTURACION_PORT:8084}

# Importar configuracion centralizada .env si existe en raiz o subdirectorio
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# --- MySQL (db_facturacion) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_facturacion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# RNF-05: no exponer detalles internos en errores
server.error.include-message=never
server.error.include-stacktrace=never
